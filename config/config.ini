[db]
file_path=data/app.db
url=sqlite:///data/app.db

[service]
mode=prod
title=Nyaugi Stepping API
version=1.0
bind=0.0.0.0
port=1919
worker_num=1

[streamlit]
port=8501

[endpoint]
prefix=/nyaugi
users=/users
step_history=/step_history
create=/create
update=/update
delete=/delete
retrieve_user_info_by_name=/retrieve_user_info_by_name
retrieve_all=/retrieve_all
retrieve_by_user_id=/retrieve_by_user_id
retrieve_by_user_name=/retrieve_by_user_name
retrieve_all_with_user_name=/retrieve_all_with_user_name
csv_import=/csv_import